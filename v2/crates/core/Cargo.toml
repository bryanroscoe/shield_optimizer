[package]
name = "shield-optimizer-core"
version = "2.4.1"
description = "Shared engine, ADB abstractions, and Tauri commands for Shield Optimizer / ATV Optimizer"
authors = ["Bryan Roscoe"]
edition = "2021"
rust-version = "1.81"
license = "LicenseRef-Proprietary"
publish = false

[features]
test-support = []

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "time", "macros", "rt-multi-thread", "sync", "fs", "net", "process"] }
anyhow = "1"
thiserror = "1"
regex = "1"
quick-xml = "0.39.4"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
ed25519-dalek = "2"
tracing = "0.1"
tempfile = "3"
async-trait = "0.1"
# Telemetry upload and the support-tier refresh. Same reqwest the desktop app
# already links; manual roots so the Android build trusts the system CA store
# instead of bundling webpki-roots (CDLA licensed, outside mobile/about.toml).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
pretty_assertions = "1"

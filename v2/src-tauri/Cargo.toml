[package]
name = "shield-optimizer-v2"
version = "2.3.0"
description = "Shield Optimizer v2 — Tauri/Rust rewrite of the Android TV debloater"
authors = ["Bryan Roscoe"]
edition = "2021"
rust-version = "1.81"
default-run = "shield-optimizer-v2"

[lib]
# The `_lib` suffix is necessary to keep the lib name unique vs. the bin name
# on Windows (see https://github.com/rust-lang/cargo/issues/8519).
name = "shield_optimizer_v2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Dev-only: the E2E server (src/bin/e2e_server.rs) runs the real command
# layer against the simulated adb. Never enabled in a release build.
e2e = ["shield-optimizer-core/test-support", "tauri/test"]

[[bin]]
name = "e2e_server"
path = "src/bin/e2e_server.rs"
required-features = ["e2e"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shield-optimizer-core = { path = "../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime — needed for Tauri command futures and ADB subprocess I/O
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "sync", "fs"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Parsing
regex = "1"

# Time / dates for snapshot timestamps
chrono = { version = "0.4", features = ["serde"] }

# Screenshot preview encoding (PNG bytes → data: URL)
base64 = "0.22"

# Tracing for structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rolling daily log files under the app data dir — a packaged app has nowhere
# for stdout to go, so without this a bug report has no log to attach.
tracing-appender = "0.2"

# Directory resolution per OS (snapshots, config)
dirs = "5"

# Async traits — for the AdbDriver abstraction
async-trait = "0.1"

# HTTPS download of Google's platform-tools (rustls = no OpenSSL native dep)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"

# ZIP extraction for platform-tools-latest-<os>.zip (and reading APK manifests)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Decode an APK's binary AndroidManifest.xml to read its package id
axmldecoder = "0.5"

[dev-dependencies]
shield-optimizer-core = { path = "../crates/core", features = ["test-support"] }
pretty_assertions = "1"
tempfile = "3"
# `start_paused` — lets the reconnect-backoff tests advance time instantly
# instead of really sleeping through it.
tokio = { version = "1", features = ["test-util"] }

[package]
name = "atv-optimizer"
version = "2.5.0"
description = "ATV Optimizer — desktop app for debloating and tuning Android TV devices"
authors = ["Bryan Roscoe"]
edition = "2021"
rust-version = "1.81"
default-run = "atv-optimizer"

[lib]
# The `_lib` suffix is necessary to keep the lib name unique vs. the bin name
# on Windows (see https://github.com/rust-lang/cargo/issues/8519).
name = "atv_optimizer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Built-in Rust ADB is the default engine; Settings → ADB switches to Google
# platform-tools. `--no-default-features` builds a platform-tools-only app.
default = ["native-adb-default"]
native-adb-default = ["direct-adb"]
direct-adb = ["dep:atv-direct-adb", "dep:mdns-sd"]
# Dev-only: the E2E server (crates/e2e-server) runs the real command layer
# against the simulated adb. Never enabled in a release build.
e2e = ["atv-optimizer-core/test-support", "tauri/test"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
atv-optimizer-core = { path = "../crates/core" }
atv-direct-adb = { path = "../crates/direct-adb", optional = true }
mdns-sd = { version = "=0.19.2", default-features = false, optional = true }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime — needed for Tauri command futures and ADB subprocess I/O
tokio = { version = "1", features = ["process", "io-util", "time", "macros", "rt-multi-thread", "sync", "fs"] }

# Error handling
thiserror = "1"

# Parsing
regex = "1"

# Time / dates for snapshot timestamps
chrono = { version = "0.4", features = ["serde"] }

# Tracing for structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Rolling daily log files under the app data dir — a packaged app has nowhere
# for stdout to go, so without this a bug report has no log to attach.
tracing-appender = "0.2"

# Directory resolution per OS (snapshots, config)
dirs = "5"

# Async traits — for the AdbDriver abstraction
async-trait = "0.1"

# HTTPS download of Google's platform-tools (rustls = no OpenSSL native dep)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"

# ZIP extraction for platform-tools-latest-<os>.zip (and reading APK manifests)
zip = { version = "2", default-features = false, features = ["deflate"] }

# Decode an APK's binary AndroidManifest.xml to read its package id
axmldecoder = "0.5"

# Counts and prefix lengths of the local network interfaces for the anonymous
# "scan found nothing" report. Addresses and names never leave the process.
if-addrs = "0.15"

# Sends the Local Network probe out of a chosen interface (IP_MULTICAST_IF).
# Already in the tree through tokio.
[target.'cfg(target_os = "macos")'.dependencies]
socket2 = "0.6"

[dev-dependencies]
atv-optimizer-core = { path = "../crates/core", features = ["test-support"] }
pretty_assertions = "1"
# Test keys for the platform-tools key loader; never the user's own key.
rsa = { version = "0.9", features = ["std", "pem", "getrandom"] }
tempfile = "3"
# `start_paused` — lets the reconnect-backoff tests advance time instantly
# instead of really sleeping through it.
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_IO", "Win32_System_Ioctl"] }

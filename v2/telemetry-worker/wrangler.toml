# ATV Optimizer telemetry backend: one Worker + one D1 database, free tier.
# Deploy steps are in README.md. Nothing here is secret: ADMIN_TOKEN is set with
# `wrangler secret put ADMIN_TOKEN` and never lives in this file.

name = "atv-optimizer-telemetry"
main = "src/index.ts"
compatibility_date = "2026-10-01"
tsconfig = "tsconfig.json"

# Workers Logs would record request metadata for every invocation. This Worker
# promises not to keep request IPs or fine-grained location, so logging stays off.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "telemetry"
# Production database (created 2026-11-01). A fork must replace this with its own id.
# Local dev and tests ignore it and use a local SQLite file.
database_id = "e86ca0a5-fc1d-4692-9602-01407920ce61"
migrations_dir = "migrations"

# Daily at 03:17 UTC: delete raw events older than RAW_RETENTION_DAYS and stale
# rate-limit counters. Aggregate tables are kept.
[triggers]
crons = ["17 3 * * *"]

[vars]
# Raw event rows older than this are purged by the cron trigger.
RAW_RETENTION_DAYS = "90"
# Per install_id, per UTC day. Requests over the cap get 429 and store nothing.
PER_INSTALL_DAILY_EVENTS = "500"
# Across all installs, per UTC day. Sized to D1's free-tier write quota (100k rows
# written/day). Worst case per event is about 7 row writes on arrival (2 quota rows,
# the raw row and its index, 3 aggregate rows) plus about 3 when the cron later
# deletes it (quota row, raw row and its index entry): ~10 per event-day under a sustained
# flood, so 7k events stays near 70k writes with headroom. See README.md.
GLOBAL_DAILY_EVENTS = "7000"

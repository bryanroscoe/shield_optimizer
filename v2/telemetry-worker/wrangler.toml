# ATV Optimizer telemetry backend: one Worker + one D1 database, free tier.
# Deploy steps are in README.md. Nothing here is secret: ADMIN_TOKEN is set with
# `wrangler secret put ADMIN_TOKEN` and never lives in this file.

name = "atv-optimizer-telemetry"
main = "src/index.ts"
compatibility_date = "2026-10-01"
tsconfig = "tsconfig.json"

# Workers Logs would record request metadata for every invocation. This Worker
# promises not to keep request IPs or any location, so logging stays off.
[observability]
enabled = false

[[d1_databases]]
binding = "DB"
database_name = "telemetry"
# Production database (created 2026-11-01). A fork must replace this with its own id.
# Local dev and tests ignore it and use a local SQLite file.
database_id = "e86ca0a5-fc1d-4692-9602-01407920ce61"
migrations_dir = "migrations"

# Daily at 03:17 UTC: delete raw events older than RAW_RETENTION_DAYS, clear log
# excerpts and delete Send logs uploads older than LOG_RETENTION_DAYS, and drop
# stale rate-limit counters. Aggregate tables are kept, unless the storage
# budget below is exceeded.
[triggers]
crons = ["17 3 * * *"]

[vars]
PRIVACY_CONTACT_EMAIL = "bryanroscoe+atv@gmail.com"
# Raw event rows older than this are purged by the cron trigger.
RAW_RETENTION_DAYS = "90"
# Log text (event log_excerpt, diag_uploads rows) is kept for less.
LOG_RETENTION_DAYS = "30"
# Per install_id, per UTC day. Requests over the cap get 429 and store nothing.
PER_INSTALL_DAILY_EVENTS = "500"
# Across all installs, per UTC day. Sized to D1's free-tier write quota (100k rows
# written/day). Worst case per event is about 8 row writes on arrival (2 quota rows,
# the raw row and its two index entries, 3 aggregate rows) plus about 4 when the cron
# later deletes it (quota row, raw row and its index entries): ~12 per event-day under
# a sustained flood, so 7k events stays near 84k writes. See README.md.
GLOBAL_DAILY_EVENTS = "7000"
# Storage. The Workers Free plan caps ONE D1 database at 500 MB (5 GB is the
# account total); past it every write, so every ingest, upload and tier sync,
# fails with 503. Worst case under a flood of made-up install ids, with the
# caps below: events 1.5 MiB/day x 90 days ~ 142 MB, uploads 6 MiB/day x 30
# days ~ 189 MB, plus row overhead and counters, ~ 335 MB of estimated data:
# more than STORAGE_BUDGET_BYTES, so in that case the cron's trim holds it at
# the budget. See "Storage budget" in README.md. Raise these only on a paid plan.
#
# Stored bytes of accepted events per UTC day across everyone: each event costs
# its string bytes plus 256 for the row and its index entries.
GLOBAL_DAILY_EVENT_BYTES = "1572864"
# Send logs uploads (POST /v1/diagnostics). The per-install cap is checked first,
# so one install can't spend the shared budget. The global caps are a count and
# a byte total per UTC day (24 full-size 256 KiB uploads, or up to 200 small
# ones). The byte cap is what a few made-up install ids could exhaust to lock
# "Send logs" out for everyone that day, so it is kept generous; the storage
# trim below is the backstop for the space.
# Each upload costs about six row writes (three quota rows, the row and its two
# index entries), so 200 a day stays near 1.2k writes.
PER_INSTALL_DAILY_UPLOADS = "5"
GLOBAL_DAILY_UPLOADS = "200"
GLOBAL_DAILY_UPLOAD_BYTES = "6291456"
# The cron frees space oldest first (uploads, then log excerpts, then raw
# events, then the oldest aggregate days) towards 80% of this when the
# estimated stored bytes pass it. Kept well under 500 MB because the estimate
# counts data, not SQLite's page overhead.
STORAGE_BUDGET_BYTES = "300000000"
# Row writes (index entries included) one cron run may spend on that trim. The
# event and upload caps use up to ~63k of the Free plan's 100k a day, so 20k
# leaves room; a bigger overshoot is worked off over several days.
STORAGE_TRIM_MAX_ROW_WRITES = "20000"

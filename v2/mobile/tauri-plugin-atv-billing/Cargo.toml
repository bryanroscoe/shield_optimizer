[package]
name = "tauri-plugin-atv-billing"
version = "0.1.0"
description = "Google Play Billing adapter for ATV Optimizer (Android); host builds report billing as unsupported"
authors = ["Bryan Roscoe"]
edition = "2021"
rust-version = "1.81"
license = "LicenseRef-Proprietary"
publish = false
links = "tauri-plugin-atv-billing"
build = "build.rs"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

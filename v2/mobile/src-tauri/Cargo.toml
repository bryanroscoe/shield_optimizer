[package]
name = "atv-optimizer-mobile"
version = "0.1.0"
description = "ATV Optimizer Android app"
authors = ["Bryan Roscoe"]
edition = "2021"
rust-version = "1.88"
license = "LicenseRef-Proprietary"
publish = false

[lib]
name = "atv_optimizer_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shield-optimizer-core = { path = "../../crates/core" }
shield-direct-adb = { path = "../../crates/direct-adb" }
tauri-plugin-atv-adb = { path = "../tauri-plugin-atv-adb" }
tauri = { version = "2", features = [] }
# Hands http(s) links to the phone's browser (an ACTION_VIEW intent on Android).
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
async-trait = "0.1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
# ISO-8601 timestamps for pulled backups. Already compiled transitively via
# shield-optimizer-core, so this adds no new build cost.
chrono = { version = "0.4", features = ["clock"] }

[dev-dependencies]
sha2 = "0.10"

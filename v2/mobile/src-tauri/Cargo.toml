[package]
name = "atv-optimizer-mobile"
version = "0.1.0"
description = "ATV Optimizer Android app"
authors = ["Bryan Roscoe"]
edition = "2021"
rust-version = "1.81"
license = "MIT"

[lib]
name = "atv_optimizer_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shield-optimizer-core = { path = "../../crates/core" }
tauri-plugin-atv-adb = { path = "../tauri-plugin-atv-adb" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
async-trait = "0.1"
base64 = "0.22"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

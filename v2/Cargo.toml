[workspace]
resolver = "2"
members = [
    "crates/core",
    "src-tauri",
    "mobile/src-tauri",
    "mobile/tauri-plugin-atv-adb",
    "tools/atvopt-license",
]
exclude = ["vendor/adb_client"]

[patch.crates-io]
# Exact 3.2.2 source plus the generic raw-service stream required by mobile's
# direct-to-adbd scrcpy control channel. See mobile/FAST-REMOTE-PLAN.md.
adb_client = { path = "vendor/adb_client" }

# Publishes the evidence committed in a PR (anything under an `evidence/`
# directory) as Actions artifacts and keeps one PR comment pointing at them.
#
# Relative links in a PR body resolve under /pull/N/ and 404, and GitHub won't
# play a .webm from a blob page, so committed videos were effectively invisible
# to reviewers. Each video is uploaded unzipped (`archive: false`) so the
# artifact link plays or downloads directly; everything else goes into one
# zipped bundle. Artifacts need a GitHub login and expire after 90 days, so the
# comment also carries commit-pinned blob links, which do not.
#
# Backfill an older or already-merged PR with:
#   gh workflow run pr-evidence.yml -f pr=<number>

name: PR evidence

on:
  pull_request:
    paths:
      - '**/evidence/**'
      - '.github/workflows/pr-evidence.yml'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to publish evidence for
        required: true

permissions:
  contents: read

concurrency:
  group: pr-evidence-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  collect:
    name: Collect evidence files
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      sha: ${{ steps.pr.outputs.sha }}
      videos: ${{ steps.files.outputs.videos }}
      images: ${{ steps.files.outputs.images }}
      count: ${{ steps.files.outputs.count }}
      bundle-url: ${{ steps.bundle.outputs.artifact-url }}
    steps:
      - name: Resolve PR and head commit
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          if [ -n "$EVENT_PR" ]; then
            pr="$EVENT_PR"; sha="$EVENT_SHA"
          else
            pr="$INPUT_PR"
            case "$pr" in ''|*[!0-9]*) echo "::error::pr must be a number"; exit 1 ;; esac
            sha=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The PR head, not the merge ref: the comment's pinned links name this SHA.
      # Merged PRs whose branch is gone stay fetchable through refs/pull/N/head.
      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.pr.outputs.sha }}
          persist-credentials: false

      - name: List evidence files changed by the PR
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.pr }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | select(.status != "removed") | .filename' \
            | grep -E '(^|/)evidence/' | while IFS= read -r f; do
                [ -f "$f" ] && printf '%s\n' "$f"
              done > evidence-files.txt || true
          echo "Evidence files:"; cat evidence-files.txt

          # Artifact names must be unique within the run, and with archive:false
          # the uploaded file takes the artifact name, so keep the extension last.
          videos=$({ grep -iE '\.(webm|mp4|mov)$' evidence-files.txt || true; } \
            | jq -R -s -c 'split("\n") | map(select(length > 0)) | map({
                path: .,
                name: (split("/") | .[-2] + "--" + .[-1])
              })')
          images=$({ grep -iE '\.(png|jpe?g|gif)$' evidence-files.txt || true; } \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          {
            echo "videos=$videos"
            echo "images=$images"
            echo "count=$(grep -c . evidence-files.txt || true)"
            echo 'paths<<EVIDENCE_EOF'
            cat evidence-files.txt
            echo 'EVIDENCE_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Upload evidence bundle
        id: bundle
        if: steps.files.outputs.count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: evidence-pr-${{ steps.pr.outputs.pr }}
          path: ${{ steps.files.outputs.paths }}
          retention-days: 90

  videos:
    name: Upload ${{ matrix.name }}
    needs: collect
    if: needs.collect.outputs.videos != '[]' && needs.collect.outputs.videos != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.collect.outputs.videos) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.collect.outputs.sha }}
          persist-credentials: false
          sparse-checkout: ${{ matrix.path }}
          sparse-checkout-cone-mode: false

      - name: Stage under its artifact name
        env:
          SRC: ${{ matrix.path }}
          NAME: ${{ matrix.name }}
        run: mkdir -p "$RUNNER_TEMP/evidence" && cp "$SRC" "$RUNNER_TEMP/evidence/$NAME"

      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/evidence/${{ matrix.name }}
          archive: false
          retention-days: 90
          if-no-files-found: error

  comment:
    name: Update PR evidence comment
    needs: [collect, videos]
    # Fork PRs get a read-only token, so they keep the artifacts but no comment.
    if: >-
      always() && needs.collect.result == 'success' && needs.collect.outputs.count != '0' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    steps:
      - name: Write comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.collect.outputs.pr }}
          SHA: ${{ needs.collect.outputs.sha }}
          VIDEOS: ${{ needs.collect.outputs.videos }}
          IMAGES: ${{ needs.collect.outputs.images }}
          BUNDLE_URL: ${{ needs.collect.outputs.bundle-url }}
          VIDEOS_RESULT: ${{ needs.videos.result }}
        run: |
          repo="$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID"
          blob="$GITHUB_SERVER_URL/$repo/blob/$SHA"
          marker='<!-- pr-evidence -->'

          gh api --paginate "repos/$repo/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq '.artifacts[] | {name, id}' | jq -s . > artifacts.json

          {
            echo "$marker"
            echo "### Evidence at \`${SHA:0:7}\`"
            echo
            echo "Published by [PR evidence]($run_url). Artifact links need a GitHub login and expire after 90 days; the commit-pinned links do not."
            echo
            if [ "$VIDEOS" != '[]' ]; then
              echo '| Video | Artifact | Pinned file |'
              echo '| --- | --- | --- |'
              jq -r --arg run "$run_url" --arg blob "$blob" --slurpfile arts artifacts.json '
                .[] | . as $v
                | ($arts[0] | map(select(.name == $v.name)) | first) as $a
                | "| `\($v.path)` | "
                  + (if $a then "[\($v.name)](\($run)/artifacts/\($a.id))" else "upload failed" end)
                  + " | [view](\($blob)/\($v.path)) |"' <<< "$VIDEOS"
              echo
            fi
            if [ "$VIDEOS_RESULT" = failure ]; then
              echo "> [!WARNING]"
              echo "> At least one video failed to upload; see the run log."
              echo
            fi
            if [ -n "$BUNDLE_URL" ]; then
              echo "All evidence files (screenshots, logs, videos): [evidence-pr-$PR.zip]($BUNDLE_URL)"
              echo
            fi
            if [ "$IMAGES" != '[]' ]; then
              echo "<details><summary>Screenshots ($(jq length <<< "$IMAGES"))</summary>"
              echo
              jq -r --arg blob "$blob" '.[] | "`\(.)`\n\n![\(.)](\($blob)/\(.)?raw=true)\n"' <<< "$IMAGES"
              echo "</details>"
            fi
          } > comment.md

          existing=$(gh api --paginate "repos/$repo/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$repo/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$repo/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

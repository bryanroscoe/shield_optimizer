# Shield-Optimizer CI Tests
# Runs Pester tests on push and PR across Windows, macOS, and Linux,
# plus the telemetry Worker's vitest suite (v2/telemetry-worker).

name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'Shield-Optimizer.ps1'
      - 'tests/**'
      - 'v2/telemetry-worker/**'
      # The Worker suite checks the support-tier file the apps embed.
      - 'v2/crates/core/data/device-support.json'
      - '.github/workflows/tests.yml'
      - '.github/workflows/device-support-report.yml'
      - '.github/scripts/report-issue*.mjs'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
    # No branch filter, so stacked PRs (base = another feature branch) are tested
    # too. v2-tests.yml skips telemetry-worker-only changes, so this workflow is
    # the only one that runs the Worker suite.
    paths:
      - 'Shield-Optimizer.ps1'
      - 'tests/**'
      - 'v2/telemetry-worker/**'
      # The Worker suite checks the support-tier file the apps embed.
      - 'v2/crates/core/data/device-support.json'
      - '.github/workflows/tests.yml'
      - '.github/workflows/device-support-report.yml'
      - '.github/scripts/report-issue*.mjs'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

# Unrelated label events must neither start tests nor cancel a useful run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'skip-ci' && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  test:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'skip-ci'))
    timeout-minutes: 15
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module -Name Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck

      - name: Run Pester tests
        shell: pwsh
        run: |
          $config = New-PesterConfiguration
          $config.Run.Path = "./tests/"
          $config.Output.Verbosity = "Detailed"
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = "test-results.xml"
          $config.TestResult.OutputFormat = "NUnitXml"

          $result = Invoke-Pester -Configuration $config

          if ($result.FailedCount -gt 0) {
            Write-Error "Tests failed: $($result.FailedCount) failures"
            exit 1
          }

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results.xml

  lint:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'skip-ci'))
    timeout-minutes: 5
    name: PowerShell Syntax Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            'Shield-Optimizer.ps1',
            [ref]$null,
            [ref]$errors
          ) | Out-Null

          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host "Syntax check passed" -ForegroundColor Green

  telemetry-worker:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'skip-ci'))
    timeout-minutes: 10
    name: Telemetry Worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/telemetry-worker

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/telemetry-worker/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

  report-issue-guard:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'skip-ci'))
    timeout-minutes: 5
    name: Report issue identity guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test .github/scripts/report-issue.test.mjs

# ATV Optimizer (v2) CI — Rust tests, frontend checks and regression suites,
# simulated-device e2e, and the mobile frontend.
#
# This workflow does NOT run Tauri's full bundle build (that lives in
# v2-release.yml). It does run `cargo clippy --all-targets -- -D warnings` and
# `cargo test` which still need the platform-specific dev libs because the tauri crate's
# build script links against them — hence the Linux apt-get step.

name: v2 Tests

on:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      # The telemetry Worker has its own job in tests.yml.
      - '!v2/telemetry-worker/**'
      - '.github/workflows/v2-tests.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
    # No branch filter: stacked PRs (base = another feature branch) need CI
    # too, and the workflow file is taken from the PR merge ref.
    paths:
      - 'v2/**'
      # The telemetry Worker has its own job in tests.yml.
      - '!v2/telemetry-worker/**'
      - '.github/workflows/v2-tests.yml'
  workflow_dispatch:
    inputs:
      native_test_app:
        description: 'Build a macOS native ADB test app artifact (no release)'
        type: boolean
        default: false

permissions:
  contents: read

# Unrelated label events must neither start tests nor cancel a useful run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' || github.event.action == 'unlabeled') && github.event.label.name != 'skip-ci' && github.event.label.name != 'native-test-app' && github.run_id || 'ci' }}
  cancel-in-progress: true

jobs:
  native-test-app:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.native_test_app) ||
      (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
       contains(github.event.pull_request.labels.*.name, 'native-test-app'))
    needs: [rust, frontend, e2e, frontend-mobile]
    name: Native ADB macOS test app
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      # Owner-test builds can Send logs; each upload is marked as this test
      # build and its automatic reports stay off. Release builds never set it.
      ATVOPT_TELEMETRY_URL: ${{ vars.ATVOPT_TELEMETRY_URL }}
      ATVOPT_TEST_BUILD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: native-test-macos-${{ hashFiles('v2/Cargo.lock') }}
      - name: Install frontend dependencies
        working-directory: v2
        run: npm ci
      - name: Label the isolated owner-test app
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const config = {
            productName: 'ATV Optimizer Native Test',
            identifier: 'com.atvoptimizer.native-test',
            app: { windows: [{
              title: `ATV Optimizer — Native Rust ADB Test — ${process.env.GITHUB_SHA.slice(0, 7)}`,
              width: 1100, height: 760, minWidth: 720, minHeight: 480,
            }] },
            bundle: { createUpdaterArtifacts: false, macOS: { signingIdentity: '-' } },
          };
          writeFileSync(`${process.env.RUNNER_TEMP}/native-test.json`, JSON.stringify(config));
          JS
      - name: Build native test app
        working-directory: v2
        run: npm run tauri -- build --debug --target universal-apple-darwin --features native-adb-default --bundles app --config "$RUNNER_TEMP/native-test.json"
      - name: Verify and archive the signed bundle
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          app='v2/target/universal-apple-darwin/debug/bundle/macos/ATV Optimizer Native Test.app'
          codesign --verify --deep --strict "$app"
          executable=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Contents/Info.plist")
          lipo "$app/Contents/MacOS/$executable" -verify_arch arm64 x86_64
          mkdir native-test-artifact
          ditto -c -k --sequesterRsrc --keepParent "$app" native-test-artifact/native-test-app.zip
          shasum -a 256 "$app/Contents/MacOS/$executable" > native-test-artifact/binary-sha256.txt
          shasum -a 256 native-test-artifact/native-test-app.zip > native-test-artifact/archive-sha256.txt
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          writeFileSync('native-test-artifact/provenance.json', JSON.stringify({
            source: process.env.GITHUB_SHA,
            pullRequestHead: process.env.PR_HEAD_SHA,
            sourceTree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            target: 'universal-apple-darwin', profile: 'debug',
            features: ['native-adb-default'], signing: 'ad-hoc',
            hardwareAcceptance: 'not performed by CI',
          }, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: native-test-macos-${{ github.sha }}
          path: native-test-artifact/
          if-no-files-found: error
          retention-days: 7

  # Windows and Linux copies of the owner-test app, for the hardware batch
  # (docs/DEVICE-TEST-SCRIPT.md N17-N18). Same opt-in label as the macOS job.
  # Installs beside a released ATV Optimizer: its own name and identifier, no
  # updater artifacts, and without the release installer hooks that close the
  # running app and clean up old Shield Optimizer installs. Linux ships only
  # the AppImage, since a .deb would collide with the released package's binary.
  native-test-bundles:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.native_test_app) ||
      (github.event_name == 'pull_request' && github.event.pull_request.state == 'open' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
       contains(github.event.pull_request.labels.*.name, 'native-test-app'))
    needs: [rust, frontend, e2e, frontend-mobile]
    name: Native ADB test bundle on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      # Owner-test builds can Send logs; each upload is marked as this test
      # build and its automatic reports stay off. Release builds never set it.
      ATVOPT_TELEMETRY_URL: ${{ vars.ATVOPT_TELEMETRY_URL }}
      ATVOPT_TEST_BUILD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: native-test-${{ matrix.os }}-${{ hashFiles('v2/Cargo.lock') }}
      - name: Install frontend dependencies
        working-directory: v2
        run: npm ci
      - name: Label the isolated owner-test app
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const config = {
            productName: 'ATV Optimizer Native Test',
            identifier: 'com.atvoptimizer.native-test',
            app: { windows: [{
              title: `ATV Optimizer — Native Rust ADB Test — ${process.env.GITHUB_SHA.slice(0, 7)}`,
              width: 1100, height: 760, minWidth: 720, minHeight: 480,
            }] },
            bundle: { createUpdaterArtifacts: false, windows: { nsis: { installerHooks: null } } },
          };
          writeFileSync(`${process.env.RUNNER_TEMP}/native-test.json`, JSON.stringify(config));
          JS
      - name: Build native test bundle
        working-directory: v2
        shell: bash
        run: npm run tauri -- build --debug --bundles ${{ matrix.bundles }} --config "$RUNNER_TEMP/native-test.json"
      - name: Collect the bundle
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir native-test-artifact
          find v2/target/debug/bundle -type f \( -name '*.AppImage' -o -name '*-setup.exe' \) -exec cp {} native-test-artifact/ \;
          shopt -s nullglob
          bundles=(native-test-artifact/*)
          [ "${#bundles[@]}" -gt 0 ] || { echo "no bundle produced"; exit 1; }
          (cd native-test-artifact && sha256sum -- ./* > sha256.txt)
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          writeFileSync('native-test-artifact/provenance.json', JSON.stringify({
            source: process.env.GITHUB_SHA,
            pullRequestHead: process.env.PR_HEAD_SHA,
            sourceTree: execFileSync('git', ['rev-parse', 'HEAD^{tree}'], { encoding: 'utf8' }).trim(),
            run: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            os: process.env.RUNNER_OS, profile: 'debug', features: ['default (built-in ADB)'],
            signing: 'unsigned', hardwareAcceptance: 'not performed by CI',
          }, null, 2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: native-test-${{ matrix.os }}-${{ github.sha }}
          path: native-test-artifact/
          if-no-files-found: error
          retention-days: 7

  rust:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        (github.event.label.name == 'skip-ci' || github.event.label.name == 'native-test-app')))
    timeout-minutes: 45
    name: Rust tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pinned to ubuntu-22.04 to match v2-release.yml — both jobs need the
        # same libwebkit2gtk-4.1-dev package name and 24.04+ ships it under
        # slightly different paths.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # The tauri crate's build script links against gtk + webkit + appindicator
      # even for `cargo check` / `cargo clippy --lib`. Without these the Linux
      # job dies with "gio-2.0.pc not found". macOS and Windows already ship
      # the bits they need.
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('v2/Cargo.lock') }}

      - name: cargo fmt
        working-directory: v2
        run: cargo fmt --all --check

      - name: cargo clippy
        working-directory: v2
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        working-directory: v2
        run: cargo test --workspace

      # The workspace steps above build the default app, with the built-in
      # engine. This keeps the platform-tools-only build (the fallback) working.
      - name: Desktop without the built-in engine
        working-directory: v2
        run: cargo test -p atv-optimizer --no-default-features --lib -- --test-threads=1

      - name: Desktop without the built-in engine, Clippy
        working-directory: v2
        run: cargo clippy -p atv-optimizer --no-default-features --all-targets -- -D warnings

      - name: Vendored transport tests
        working-directory: v2/vendor/adb_client
        run: cargo test --lib

  frontend:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        (github.event.label.name == 'skip-ci' || github.event.label.name == 'native-test-app')))
    timeout-minutes: 20
    name: Frontend type check
    # Pinned: Playwright 1.60 can't install Chromium on ubuntu-latest's 26.04 image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Informational profile catalog
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 v2/catalogs/cleanyourtv/catalog.py check
          python3 -m unittest discover -s v2/catalogs/cleanyourtv -p 'test_*.py'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        working-directory: v2
        run: npm ci

      - name: svelte-check
        working-directory: v2
        run: npm run check

      - name: Frontend build
        working-directory: v2
        run: npm run build

      # Guards the SmartTube backup-path catalog (#86) and the pairing flow,
      # which never guesses HOST:5555 (#88).
      - name: App-files catalog
        working-directory: v2
        run: npm run test:app-files-catalog

      - name: Install test browser
        working-directory: v2
        run: npx playwright install --with-deps chromium

      - name: Pairing flow
        working-directory: v2
        run: npm run test:pairing-flow

      - name: Device and package source catalog
        working-directory: v2
        run: npm run test:profile-catalog

      - name: Catalog review queue
        run: python3 -m unittest discover -s v2/tools/catalog-review -p 'test_*.py'

      # The Sideload tab must not read the remembered APK folder until asked
      # (#89) — that folder is often a removable volume.
      - name: Sideload scan
        working-directory: v2
        run: npm run test:sideload-scan

      # One device reached two ways is one row; a phone says so and doesn't
      # open the TV tools; a network device isn't told to find a USB dialog.
      - name: Device list rows
        working-directory: v2
        run: npm run test:device-list-rows

      # Stopping adb on quit disconnects every tool on the computer, so the
      # checkbox may only show what the native side confirmed.
      - name: Stop ADB when quitting
        working-directory: v2
        run: npm run test:stop-adb-on-quit

      # Release notes are remote Markdown from the updater manifest: they must
      # render before an update installs, and must never become markup.
      - name: Release notes parser
        working-directory: v2
        run: npm run test:release-notes

      - name: Update notes dialog
        working-directory: v2
        run: npm run test:update-notes-dialog

      # The after-update pop-up shows once per version increase, from notes
      # bundled with the app, and never on a relaunch at the same version.
      - name: Notes seen
        working-directory: v2
        run: npm run test:notes-seen

      # The "rolling out" banner must agree with the backend's update check on
      # what "newer" means — including that beta.10 beats beta.9.
      - name: Version compare
        working-directory: v2
        run: npm run test:version-compare

      # adb pair/connect failures get plain guidance with the raw text kept,
      # and unknown errors are not guessed at.
      - name: adb errors
        working-directory: v2
        run: npm run test:adb-errors

      # The Remote box accepts paste (#91) — it exists for long URLs and
      # passwords.
      - name: Remote paste
        working-directory: v2
        run: npm run test:remote-paste

      - name: Remote lifecycle
        working-directory: v2
        run: npm run test:remote-lifecycle

      # Memory-table verdicts must resolve instead of sitting on "Checking".
      # That failure throws and logs nothing; only rendering the table catches it.
      - name: Memory safety verdicts
        working-directory: v2
        run: npm run test:memory-safety

      # Debloat wizard rows must resolve instead of sitting on "Checking
      # safety", which leaves the plan with no actions. Silent; only rendering
      # the wizard catches it.
      - name: Optimize plan
        working-directory: v2
        run: npm run test:optimize-plan

      - name: Playback and expert shell regressions
        working-directory: v2
        run: npm run test:playback-shell

      - name: Custom shell bookmark editing
        working-directory: v2
        run: npm run test:shell-bookmarks

      - name: App List enabled and disabled filters
        working-directory: v2
        run: npm run test:app-state-filter

      - name: Snapshot deletion
        working-directory: v2
        run: npm run test:snapshot-delete

      # Every plan row must resolve its verdict, including rows the plan
      # proposes no action on.
      - name: Optimize safety on every row
        working-directory: v2
        run: npm run test:optimize-safety-all-rows

      - name: Expert shell acknowledgement
        working-directory: v2
        run: npm run test:shell-acknowledge

      - name: Report a bug
        working-directory: v2
        run: npm run test:report-bug

      # Report this app: the preview is what is shared, it never carries a
      # serial or address, and the saved file is the registry-triage shape.
      - name: Report this app
        working-directory: v2
        run: npm run test:app-report

      - name: Reported package display names
        working-directory: v2
        run: npm run test:reported-package-names

      # Checks that icons sit on their label and that sibling controls in a
      # row share one centre line.
      - name: Icon and control alignment
        working-directory: v2
        run: npm run test:icon-alignment

      - name: Files drag and drop
        working-directory: v2
        run: npm run test:files-drop

      # App List, Optimize and Health must use one recommendation vocabulary.
      - name: Recommendation labels
        working-directory: v2
        run: npm run test:recommendation-labels

      - name: Device log snapshots and lifecycle
        working-directory: v2
        run: npm run test:device-logs

      - name: TVRecommendations safety defaults
        working-directory: v2
        run: TVRECOMMENDATIONS_EVIDENCE=1 npm run test:tvrecommendations-safety

      - name: Launcher rows
        working-directory: v2
        run: LAUNCHER_CURATION_EVIDENCE=1 npm run test:launcher-rows

      - name: Launcher feedback
        working-directory: v2
        run: LAUNCHER_FEEDBACK_EVIDENCE=1 npm run test:launcher-feedback

      - name: Progressive help
        working-directory: v2
        run: npm run test:progressive-help
      - name: Direct backend status
        working-directory: v2
        run: npm run test:direct-adb-status

      - name: Native discovery
        working-directory: v2
        run: npm run test:native-discovery && npm run test:native-scan-progress

      - name: Approval dialog and test-build settings
        working-directory: v2
        run: npm run test:approval-dialog && npm run test:test-build-settings

      # Right-click shows the app menu, not the webview's link menu (#129),
      # while text fields keep their native Cut / Copy / Paste.
      - name: Restart onboarding recovery
        working-directory: v2
        run: npm run test:restart-onboarding

      - name: Context menu
        working-directory: v2
        run: npm run test:context-menu

      - name: Telemetry, error codes and support copy
        working-directory: v2
        run: npm run test:telemetry-errors-support

      - name: Support tier badges and report setting
        working-directory: v2
        run: npm run test:support-tiers-ui

      - name: Settings screen
        working-directory: v2
        run: npm run test:settings-screen

      - name: macOS Local Network notice
        working-directory: v2
        run: npm run test:local-network-notice

      # Reviewable UI frames also allow gallery regeneration without a local browser.
      - name: Capture demo screenshots
        working-directory: v2
        run: node screenshots/capture.mjs

      - name: Upload demo screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-demo-frames
          path: |
            v2/screenshots/frames/
            v2/screenshots/frames-light/
            v2/evidence/launcher-curation-2026-10-23/*-simulated.png
            v2/evidence/launcher-curation-2026-10-23/launcher-states-simulated.webm
            v2/evidence/tvrecommendations-safety/*-simulated.png
            v2/evidence/tvrecommendations-safety/caution-review-simulated.webm
            v2/evidence/launcher-feedback-212/*-simulated.png
            v2/evidence/launcher-feedback-212/launcher-feedback-simulated.webm
          retention-days: 7
          if-no-files-found: ignore

  # The real Rust command layer against simulated devices, with Playwright
  # driving the real UI. See v2/e2e/README.md.
  e2e:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        (github.event.label.name == 'skip-ci' || github.event.label.name == 'native-test-app')))
    timeout-minutes: 45
    name: End-to-end (simulated devices)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            v2/target
          key: ${{ runner.os }}-cargo-v2-e2e-${{ hashFiles('v2/Cargo.lock') }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/package-lock.json

      - name: Install dependencies
        working-directory: v2
        run: npm ci

      - name: Install test browser
        working-directory: v2
        run: npx playwright install --with-deps chromium

      # The e2e feature is off in every other job, so lint it here.
      - name: Clippy (e2e feature)
        working-directory: v2
        run: cargo clippy -p atv-optimizer -p e2e-server --features atv-optimizer/e2e --all-targets -- -D warnings

      - name: Offline fixture end-to-end suite
        working-directory: v2
        run: npm run e2e:offline

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: v2/e2e/artifacts/
          retention-days: 14

  frontend-mobile:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.state == 'open' &&
       !contains(github.event.pull_request.labels.*.name, 'skip-ci') &&
       ((github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        (github.event.label.name == 'skip-ci' || github.event.label.name == 'native-test-app')))
    timeout-minutes: 20
    name: Mobile frontend type check
    # Pinned: Playwright 1.60 can't install Chromium on ubuntu-latest's 26.04 image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: v2/mobile/package-lock.json

      - name: Install dependencies
        working-directory: v2/mobile
        run: npm ci

      - name: svelte-check
        working-directory: v2/mobile
        run: npm run check

      - name: Frontend build
        working-directory: v2/mobile
        run: npm run build

      - name: Install test browser
        working-directory: v2/mobile
        run: npx playwright install --with-deps chromium

      - name: Mobile behavior regressions
        working-directory: v2/mobile
        run: npm test
